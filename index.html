<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="字字岛">
<meta name="description" content="自由选课、认读、听写和复习的中文学习应用。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>字字岛</title>
<script src="./library.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<a class="jump" href="#main">跳到内容</a>
<header class="top"><div class="frame bar">
<a class="brand" href="#learn"><span class="mark" aria-hidden="true">字</span><span>字字岛</span></a>
<nav aria-label="功能导航">
<a data-page="learn" href="#learn">选课练习</a>
<a data-page="review" href="#review">错词本</a>
<a data-page="parent" href="#parent">家长管理</a>
</nav></div></header>
<main id="main" class="frame" tabindex="-1"></main>
<footer class="frame footer"><span>字字岛</span><span id="offline">学习记录保存在本机</span></footer>
<div id="notice" role="status" aria-live="polite"></div>
<template id="lesson-form">
<form class="stack editor">
<label>课文或分组名称<input name="title" maxlength="80" required></label>
<label>内容类型<select name="kind"><option value="words">字词</option><option value="poem">古诗</option></select></label>
<label data-text-label>每行一个字词，可在词后加「｜拼音」<textarea name="content" rows="7" required></textarea></label>
<label data-author hidden>作者或朝代<input name="author" maxlength="100"></label>
<button class="primary" type="submit">保存课文</button>
</form>
</template>
</body>
</html>
